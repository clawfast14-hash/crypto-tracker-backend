<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CryptoWatch</title>
<style>
:root,:root[data-theme="dark"]{--bg:#0b0e14;--panel:#141925;--line:#222a3a;--text:#e8ecf4;--mute:#8793a8;--up:#2ecc8f;--down:#ff5c6c;--acc:#6c8cff}
:root[data-theme="light"]{--bg:#f3f5f9;--panel:#fff;--line:#e2e6ee;--text:#151a26;--mute:#6a7488;--up:#12a36b;--down:#e0394a;--acc:#4663e8}
:root[data-theme="neon"]{--bg:#0a0620;--panel:#150c36;--line:#2d1d63;--text:#f2eaff;--mute:#9f8fd1;--up:#00f5c8;--down:#ff3d9a;--acc:#b44cff}
:root[data-theme="ocean"]{--bg:#06202b;--panel:#0b3140;--line:#14506a;--text:#e6f7fb;--mute:#86b5c4;--up:#4de3a8;--down:#ff7a6b;--acc:#2fc4e8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,color-mix(in srgb,var(--acc) 18%,transparent),transparent),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:20px 16px;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;cursor:pointer}.logo span{color:var(--acc)}
.right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.live{font-size:12px;color:var(--mute)}
.themes{display:flex;gap:8px}.th{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.th.on{border-color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:0 16px 32px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
#q{flex:1;min-width:180px}
.tabs{display:flex;gap:6px;padding:4px 0 10px;flex-wrap:wrap;align-items:center}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:grid;grid-template-columns:32px 32px minmax(120px,1.6fr) 1fr 80px 1fr 100px;gap:8px;align-items:center;padding:10px 6px;border-radius:12px;cursor:pointer}
.row:not(.hd):hover{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.hd{color:var(--mute);font-size:12px;cursor:default;border-bottom:1px solid var(--line);border-radius:0}
.row .p,.row .cp,.row .ch{text-align:right}
@media(max-width:640px){.row{grid-template-columns:28px minmax(100px,1.6fr) 1fr 72px}.rk,.cp,.sp,.hd .x{display:none}}
.st{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:0}.st.on{color:#f5b301}
.who{display:flex;align-items:center;gap:10px}.who b{display:block}.who small{color:var(--mute)}
.ic{width:32px;height:32px;flex:none;position:relative}.ic svg,.ic img{width:100%;height:100%;display:block;border-radius:50%}
.ic .lt{position:absolute;inset:0;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.ic img{position:absolute;inset:0;background:var(--panel)}
.up{color:var(--up)}.down{color:var(--down)}.ch{font-size:13px}.rk{color:var(--mute)}
.sp{width:100px;height:28px}
.msg{color:var(--mute);padding:20px;text-align:center}
.back{background:none;border:0;color:var(--acc);font:inherit;cursor:pointer;padding:4px 0 12px}
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;padding:4px 8px}
.hd2{display:flex;align-items:center;gap:10px;color:var(--mute)}.big{font-size:32px;font-weight:700;color:var(--text)}
#chart{width:100%;height:280px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 0}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px}.stat small{display:block;color:var(--mute)}
.about{color:var(--mute);line-height:1.55;font-size:14px;margin:6px 0 12px}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;color:var(--acc);text-decoration:none;font-size:14px}
.nav{display:flex;gap:6px}.nav a{padding:8px 14px;border-radius:999px;color:var(--mute);text-decoration:none;font-size:14px;border:1px solid transparent}.nav a.on{color:var(--text);border-color:var(--line);background:var(--panel)}
.form{display:grid;grid-template-columns:1.3fr 1fr 1.3fr auto;gap:8px}@media(max-width:640px){.form{grid-template-columns:1fr 1fr}.form select,.form button{grid-column:1/-1}}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.hint{color:var(--mute);font-size:12px;margin-top:6px;min-height:16px}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:4px 8px 12px}.sum small{color:var(--mute);display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid var(--line);border-radius:12px;padding:12px}.card small{color:var(--mute);display:block}.card b{font-size:20px}
.alloc{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:var(--line)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-bottom:10px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.prow{display:grid;grid-template-columns:minmax(110px,1.5fr) 1fr 1fr 1fr 1fr 56px 1.1fr 28px;gap:8px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);font-size:14px}
.prow.hd{border-top:0;border-bottom:1px solid var(--line);cursor:default}.prow>*:not(.who){text-align:right}
.x2{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}.x2:hover{color:var(--down)}
@media(max-width:700px){.prow{grid-template-columns:minmax(90px,1.5fr) 1fr 1fr 28px}.prow .m{display:none}}
.fbig{font-size:34px;font-weight:700}.fsub{color:var(--mute);font-size:13px;margin-top:4px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}.ph>b{font-size:15px}
.lsbar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:12px 0 6px;font-size:12px;font-weight:600;color:#fff}
.lsbar div{display:grid;place-items:center;min-width:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fgbar{height:14px;border-radius:7px;background:linear-gradient(90deg,#ff4d4d,#ff9f43,#f5c518,#8bd450,#2ecc8f);position:relative;margin:16px 0 8px}
.fgbar i{position:absolute;top:-5px;width:6px;height:24px;border-radius:3px;background:var(--text);border:2px solid var(--panel);transform:translateX(-50%)}
.fgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.fgs .card{flex:1;min-width:100px}
.mini{width:100%;height:120px;display:block;margin-top:8px}
.frow{display:grid;grid-template-columns:minmax(110px,1.4fr) 1fr 90px 90px 1fr;gap:8px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.frow:not(.hd):hover{background:color-mix(in srgb,var(--acc) 9%,transparent)}.frow.hd{cursor:default;border-top:0;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px}
.frow>*:not(.who){text-align:right}@media(max-width:640px){.frow{grid-template-columns:minmax(90px,1.4fr) 1fr 74px 80px}.frow .m{display:none}}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 6px;border-top:1px solid var(--line);font-size:14px}
.al.done{opacity:.75}.al small{color:var(--mute);display:block}
.aform{display:grid;grid-template-columns:1.4fr 80px 1.2fr;gap:8px}.aform .full{grid-column:1/-1}
@media(max-width:560px){.aform{grid-template-columns:1fr 80px}.aform input{grid-column:1/-1}}
.chk{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mute)}.chk label{cursor:pointer}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}@media(max-width:560px){.sgrid{grid-template-columns:1fr}}
.btn2{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}
.help{color:var(--mute);font-size:12px;line-height:1.5;margin:6px 0}.ok{color:var(--up)}.bad{color:var(--down)}
#accl{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auth{display:flex;flex-direction:column;gap:8px}
.prof{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
a.card{color:inherit;text-decoration:none;display:block}a.card:hover{border-color:var(--acc)}
.sec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sec>b{display:block;margin-bottom:8px}
.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,var(--line))}

/* ===== V7: UI ===== */
:root{color-scheme:dark}:root[data-theme="light"]{color-scheme:light}
body,.panel{transition:background-color .35s,color .35s,border-color .35s}
.tt,.tt *{transition:background-color .4s,color .4s,border-color .4s,fill .4s,stroke .4s,box-shadow .4s!important}
.coin,.row,.frow,.tab,.btn,.btn2,.card,.stat,.nav a,.th{transition:background-color .2s,border-color .2s,color .2s,transform .15s,box-shadow .2s}
.btn:active,.btn2:active,.tab:active{transform:scale(.96)}
.th:hover{transform:scale(1.18)}
.card:hover,.stat:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
:root[data-theme="light"] .panel{box-shadow:0 1px 2px rgba(20,30,60,.05),0 8px 24px rgba(20,30,60,.06)}
:root[data-theme="neon"] .panel{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 0 28px color-mix(in srgb,var(--acc) 14%,transparent)}
:root[data-theme="neon"] .logo span{text-shadow:0 0 14px var(--acc)}
:root[data-theme="neon"] .tab.on,:root[data-theme="neon"] .btn{box-shadow:0 0 16px color-mix(in srgb,var(--acc) 70%,transparent)}
:root[data-theme="neon"] .big{text-shadow:0 0 18px color-mix(in srgb,var(--acc) 45%,transparent)}
:root[data-theme="neon"] #cpl{filter:drop-shadow(0 0 6px currentColor)}
#cpl{transition:color .5s}#chart stop{transition:stop-color .5s}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#app>*{animation:fadeUp .35s ease both}
#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}#app>*:nth-child(4){animation-delay:.15s}
.in>*{animation:fadeIn .4s ease both}
.row .p{justify-self:end;border-radius:6px;padding:0 4px}
@keyframes flashUp{0%{background:color-mix(in srgb,var(--up) 38%,transparent)}100%{background:transparent}}
@keyframes flashDown{0%{background:color-mix(in srgb,var(--down) 38%,transparent)}100%{background:transparent}}
.p.fu{animation:flashUp 1.2s ease-out}.p.fd{animation:flashDown 1.2s ease-out}
/* skeleton */
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--text) 9%,var(--panel)) 25%,color-mix(in srgb,var(--text) 17%,var(--panel)) 50%,color-mix(in srgb,var(--text) 9%,var(--panel)) 75%);background-size:200% 100%;animation:shine 1.4s ease-in-out infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.sk-row{pointer-events:none}
.skb{fill:color-mix(in srgb,var(--text) 14%,var(--panel));animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<header><div class="logo" onclick="location.hash=''">Crypto<span>Watch</span></div><nav class="nav"><a href="#">Рынок</a><a href="#/portfolio">💼 Портфель</a><a href="#/futures">⚡ Futures</a><a href="#/alerts">🔔 Алерты</a><a href="#/account" id="accl">👤 Войти</a></nav><div class="right"><div class="themes" id="themes"></div><div class="live" id="status">Загрузка…</div></div></header>
<main id="app"></main>
<script>
const CG='https://api.coingecko.com/api/v3', BN='https://data-api.binance.vision/api/v3';
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement('div');d.textContent=t??'';return d.innerHTML};
const fmt=v=>v==null?'–':'$'+(v>=100?v.toLocaleString('en-US',{maximumFractionDigits:0}):v>=1?v.toFixed(2):v>=0.01?v.toFixed(4):v.toFixed(8));
const big=v=>v==null?'–':v>=1e12?'$'+(v/1e12).toFixed(2)+' трлн':v>=1e9?'$'+(v/1e9).toFixed(1)+' млрд':'$'+(v/1e6).toFixed(0)+' млн';
const pc=v=>v==null?'–':(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(2)+'%';
const dt=s=>s?new Date(s).toLocaleDateString('ru-RU'):'';

let me=null;
let acct=null;

async function j(url,t=10000){const c=new AbortController(),m=setTimeout(()=>c.abort(),t);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(m)}}

// ---------- логотипы ----------
const G={BTC:'<path d="M12 8.5v15M12 9h5.3a3.2 3.2 0 010 6.4H12M12 15.4h6.2a3.3 3.3 0 010 6.6H12M14.5 6.5v2.5M17.5 6.5v2.5M14.5 22v2.6M17.5 22v2.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
ETH:'<path d="M16 5l7 11-7 4-7-4z" fill="#fff"/><path d="M16 22l7-4-7 9-7-9z" fill="#fff" opacity=".7"/>',
BNB:'<g fill="#fff"><path d="M16 12.4l3.6 3.6-3.6 3.6-3.6-3.6z"/><path d="M16 6l3 3-3 3-3-3z"/><path d="M16 20l3 3-3 3-3-3z"/><path d="M6 16l3-3 3 3-3 3z"/><path d="M20 16l3-3 3 3-3 3z"/></g>',
SOL:'<g fill="#fff"><path d="M10 8h15l-3 4H7z"/><path d="M7 14h15l3 4H10z"/><path d="M10 20h15l-3 4H7z"/></g>',
XRP:'<path d="M9 9l7 7 7-7M9 23l7-7 7 7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'};
const COL={BTC:'#f7931a',ETH:'#627eea',BNB:'#d4a017',SOL:'#9945ff',XRP:'#2f9bd8'};
function logo(c){const s=c.symbol.toUpperCase();
 if(G[s])return `<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${COL[s]}"/>${G[s]}</svg>`;
 return `<span class="lt">${esc(s[0])}</span>${c.image?`<img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.remove()">`:''}`}

// ---------- темы ----------
const THEMES=[{k:'dark',l:'Тёмная',c:'#0b0e14'},{k:'light',l:'Светлая',c:'#f3f5f9'},{k:'neon',l:'Неон',c:'#b44cff'},{k:'ocean',l:'Океан',c:'#2fc4e8'}];
function setTheme(k,save=true){if(save){document.documentElement.classList.add('tt');setTimeout(()=>document.documentElement.classList.remove('tt'),500)}document.documentElement.dataset.theme=k;if(save)localStorage.setItem('theme',k);
 $('themes').innerHTML=THEMES.map(t=>`<button class="th ${t.k===k?'on':''}" title="${t.l}" aria-label="${t.l}" style="background:${t.c}" onclick="setTheme('${t.k}')"></button>`).join('')}
setTheme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'),false);

// ---------- данные рынка ----------
let coins=[],favs=new Set(JSON.parse(localStorage.getItem('favs')||'[]')),st={q:'',lim:100,sort:'cap',tab:'all'};
let flash={};
async function loadCoins(){
 const prevP={};coins.forEach(c=>prevP[c.id]=c.current_price);
 try{
  coins=await j(`${CG}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=true&price_change_percentage=24h,7d,30d`);
  localStorage.setItem('mk',JSON.stringify({t:Date.now(),d:coins.map(c=>({...c,sparkline_in_7d:{price:(c.sparkline_in_7d?.price||[]).filter((_,i)=>i%4===0)}}))}));
  $('status').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU')+' · CoinGecko';
 }catch(e){
  const m=JSON.parse(localStorage.getItem('mk')||'null');
  if(m&&!coins.length){coins=m.d;$('status').textContent='Лимит API: показаны данные от '+new Date(m.t).toLocaleTimeString('ru-RU')}
  else if(!coins.length)$('status').textContent='Не удалось загрузить список (лимит API).';
 }
 flash={};coins.forEach(c=>{const o=prevP[c.id];if(o!=null&&o!==c.current_price)flash[c.id]=c.current_price>o?'fu':'fd'});route(true);flash={};
}

// ---------- рынок ----------
const SORTS={cap:(a,b)=>b.market_cap-a.market_cap,price:(a,b)=>b.current_price-a.current_price,gain:(a,b)=>b.price_change_percentage_24h-a.price_change_percentage_24h,loss:(a,b)=>a.price_change_percentage_24h-b.price_change_percentage_24h};
function spark(c){const d=c.sparkline_in_7d?.price||[];if(d.length<2)return '';const hi=Math.max(...d),lo=Math.min(...d),n=d.length;
 const pts=d.map((v,i)=>(i/(n-1)*100).toFixed(1)+','+(2+(1-(v-lo)/(hi-lo||1))*24).toFixed(1)).join(' ');
 return `<svg class="sp" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${d[n-1]>=d[0]?'var(--up)':'var(--down)'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}
function showMarket(){
 $('app').innerHTML=`<div class="panel"><div class="bar"><input id="q" type="search" placeholder="🔍 Поиск: Bitcoin, Ethereum, SOL…" value="${esc(st.q)}"><select id="lim"><option value="50">Top 50</option><option value="100">Top 100</option></select><select id="srt"><option value="cap">По капитализации</option><option value="price">По цене</option><option value="gain">Рост за 24ч</option><option value="loss">Падение за 24ч</option></select></div><div class="tabs" id="mt"></div><div class="row hd"><span></span><span class="rk">#</span><span>Монета</span><span style="text-align:right">Цена</span><span style="text-align:right">24ч</span><span class="x" style="text-align:right">Капитализация</span><span class="x" style="text-align:right">7 дней</span></div><div id="rows"></div></div>`;
 $('lim').value=st.lim;$('srt').value=st.sort;
 $('q').oninput=e=>{st.q=e.target.value;rows()};$('lim').onchange=e=>{st.lim=+e.target.value;rows()};$('srt').onchange=e=>{st.sort=e.target.value;rows()};
 $('rows').onclick=e=>{const f=e.target.closest('[data-fav]');if(f){toggleFav(f.dataset.fav);return}const r=e.target.closest('[data-id]');if(r)location.hash='#/coin/'+r.dataset.id};
 rows();
}
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('favs',JSON.stringify([...favs]));if($('rows'))rows();else if($('favbtn'))$('favbtn').className='st'+(favs.has(id)?' on':'')}
function rows(){
 $('mt').innerHTML=`<button class="tab ${st.tab==='all'?'on':''}" onclick="st.tab='all';rows()">Все</button><button class="tab ${st.tab==='fav'?'on':''}" onclick="st.tab='fav';rows()">⭐ Избранное (${favs.size})</button>`;
 if(!coins.length){$('rows').innerHTML=skRows(10);return}
 const q=st.q.trim().toLowerCase();
 let l=coins.slice(0,st.lim).filter(c=>(st.tab==='all'||favs.has(c.id))&&(!q||c.name.toLowerCase().includes(q)||c.symbol.toLowerCase().includes(q)));
 l.sort(SORTS[st.sort]);

let amode='login';
function navAcc(){const a=$('accl');if(a)a.textContent=acct?'👤 '+acct.name:'👤 Войти'}

async function checkAuthMe(){
 const token=localStorage.getItem('access_token');
 if(!token)return;
 try{
  const r=await fetch('/api/v1/auth/me',{headers:{'Authorization':'Bearer '+token}});
  if(r.ok){const u=await r.json();acct=u;me=u.login;navAcc()}
  else{localStorage.removeItem('access_token');acct=null;me=null;navAcc()}
 }catch(e){console.error(e)}
}

function endSession(){
 localStorage.removeItem('access_token');
 acct=null;
 me=null;

}

function showAuth(){
 const reg=amode==='reg';
 $('app').innerHTML=`<div class="panel" style="max-width:440px;margin:0 auto"><div class="tabs"><button class="tab ${!reg?'on':''}" onclick="amode='login';showAuth()">Вход</button><button class="tab ${reg?'on':''}" onclick="amode='reg';showAuth()">Регистрация</button></div>
 <div class="auth">
 ${reg?'<input id="rn" placeholder="Имя" autocomplete="name" maxlength="40">':''}
 <input id="lg" placeholder="Login" autocomplete="username" maxlength="24">
 ${reg?'<input id="re" type="email" placeholder="Почта" autocomplete="email">':''}
 <input id="pw" type="password" placeholder="Password" autocomplete="${reg?'new-password':'current-password'}">
 ${reg?'<input id="pw2" type="password" placeholder="Повтори пароль" autocomplete="new-password">':''}
 <button class="btn" id="go">${reg?'Зарегистрироваться':'Войти'}</button></div>
 <div class="hint" id="ae"></div>
 <div class="help">🔒 Авторизация подключена к базе данных FastAPI через JWT.</div></div>`;
 document.querySelectorAll('.auth input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')$('go').click()});$('go').onclick=async()=>{
  const err=t=>{$('ae').className='hint bad';$('ae').textContent=t};$('go').disabled=true;
  try{
   const lg=$('lg').value.trim(),pw=$('pw').value;
   if(!lg||!pw)return err('Заполните все поля.');

   if(!reg){
    const body=new URLSearchParams();
    body.append('username',lg);
    body.append('password',pw);
    
    const res=await fetch('/api/v1/auth/login',{
     method:'POST',
     headers:{'Content-Type':'application/x-www-form-urlencoded'},
     body:body
    });
    if(!res.ok){
     const jerr=await res.json().catch(()=>({}));
     throw new Error(jerr.detail||'Неверный логин или пароль.');
    }
    const data=await res.json();
    localStorage.setItem('access_token',data.access_token);
    acct={name:data.name,login:data.login,email:data.email};
    me=data.login;
    location.hash='#/account';
    location.reload();
    return;
   }

   const nm=$('rn').value.trim(),em=$('re').value.trim(),pw2=$('pw2').value;
   if(!nm)return err('Укажите имя.');
   if(!em)return err('Укажите почту.');
   if(pw.length<8)return err('Пароль должен быть не менее 8 символов.');
   if(pw!==pw2)return err('Пароли не совпадают.');

   const res=await fetch('/api/v1/auth/register',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({login:lg,name:nm,email:em,password:pw})
   });
   if(!res.ok){
    const jerr=await res.json().catch(()=>({}));
    throw new Error(jerr.detail||'Ошибка регистрации.');
   }
   const data=await res.json();
   localStorage.setItem('access_token',data.access_token);
   acct={name:data.name,login:data.login,email:data.email};
   me=data.login;
   location.hash='#/account';
   location.reload();

  }catch(e){err(e.message)}finally{if($('go'))$('go').disabled=false}
 };
}

 const act=['#/portfolio','#/futures','#/alerts','#/account'].includes(h)?h:'#';
 document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===act));
 if(h==='#/account'){if(soft&&($('accfav')||$('go'))){if($('accfav'))accFav();return}showAccount();return}
 if(h==='#/alerts'){if(soft&&$('aldyn')){alDyn();return}showAlerts();return}
 if(h==='#/futures'){if(soft&&$('fut')){futT=setInterval(loadFut,30000);return}showFutures();return}
 if(h==='#/portfolio'){if(soft&&$('pfdyn')){pfDyn();return}showPortfolio();return}

 if(m){if(soft&&$('chart')&&h.endsWith(m[1])){const c=coins.find(x=>x.id===m[1]);if(c)stats(c);return}showCoin(decodeURIComponent(m[1]))}
 else{if(soft&&$('rows')){rows();return}showMarket()}
